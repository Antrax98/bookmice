services:
  postgres:
    image: postgres:18.6-alpine
    restart: no
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  adminer:
    restart: no
    image: msav/adminer-autologin
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: postgres
      ADMINER_USERNAME: ${DB_USER}
      ADMINER_PASSWORD: ${DB_PASS}
      ADMINER_DB: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
